[package]
name = "weather-forecast-app-distributed"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["json", "query"] }
thiserror = "2.0"
