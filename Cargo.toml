[package]
name = "weather-forecast-app-distributed"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.*"
futures = "0.3"
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
tokio = { version = "1.53.*", features = ["fs", "rt-multi-thread", "macros"] }
reqwest = { version = "0.13.*", features = ["json", "query"] }
